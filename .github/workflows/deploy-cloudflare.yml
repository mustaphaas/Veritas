name: Deploy Veritas to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Gemini resilience patch
        run: |
          node --check scripts/patch-veritas-gemini-resilience.mjs
          node --test tests/gemini-resilience-patch.test.mjs

      - name: Apply Gemini empty-response resilience
        run: node scripts/patch-veritas-gemini-resilience.mjs

      - name: Apply official REA public knowledge and team snapshot
        run: node scripts/patch-veritas-public-rea-knowledge.mjs

      - name: Apply consultant D1 tenancy and field-officer lifecycle
        run: node scripts/patch-consultant-d1-tenancy.mjs

      - name: Apply consultant project identity lookup
        run: node scripts/patch-consultant-project-identity.mjs

      - name: Apply consultant assignment identity normalization
        run: node scripts/patch-consultant-assignment-normalized-identity.mjs

      - name: Apply consultant full-portfolio coverage map
        run: node scripts/patch-consultant-coverage-map-full-portfolio.mjs

      - name: Apply verified consultant report view
        run: node scripts/patch-consultant-verified-report-view.mjs

      - name: Validate consultant tenancy regression
        run: node --test --test-concurrency=1 tests/consultant-tenancy-patch.test.mjs tests/consultant-live-profile.test.mjs tests/consultant-projects-visible-before-field-assignment.test.mjs tests/consultant-map-allocated-projects.test.mjs tests/consultant-coverage-map-full-portfolio.test.mjs tests/consultant-map-unassigned-status.test.mjs tests/consultant-portfolio-refresh-resilience.test.mjs tests/consultant-project-identity-lookup.test.mjs tests/consultant-awaiting-project-visibility.test.mjs tests/consultant-map-nondraft-portfolio.test.mjs tests/consultant-assignment-normalized-identity.test.mjs tests/consultant-verified-report-view.test.mjs

      - name: Apply database-backed REA users and classifications
        run: node scripts/patch-rea-users-database.mjs

      - name: Validate REA users database regression
        run: node --test tests/rea-users-database.test.mjs

      - name: Validate worker and Claims syntax
        run: |
          node --check worker/index.js
          node --check worker/entry.js
          node --check worker/claims-api.js
          node --check worker/field-api.js

      - name: Validate Claims contracts
        run: node --test tests/claims-api-contract.test.mjs tests/claims-immutable-assignment.test.mjs tests/claims-migration.test.mjs

      - name: Build client
        run: npm run build:client

      - name: Provision D1 and optional R2 bindings
        run: node scripts/provision-cloudflare.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply database migrations
        run: npx wrangler@latest d1 migrations apply veritas-production --remote --config wrangler.generated.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker and assets
        run: npx wrangler@latest deploy --config wrangler.generated.json --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Inspect active production deployment
        run: npx wrangler@latest deployments list
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
