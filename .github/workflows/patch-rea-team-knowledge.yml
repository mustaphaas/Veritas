name: Patch REA team knowledge

on:
  push:
    paths:
      - '.github/workflows/patch-rea-team-knowledge.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add official REA leadership knowledge
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('worker/index.js')
          text = path.read_text()

          old = '''For general questions that do not require private Veritas data, answer from your general knowledge. Never expose passwords, password hashes, salts, session tokens, personal phone numbers, email addresses, signatures, device IDs, or precise private evidence coordinates.'''

          new = '''REA INSTITUTIONAL KNOWLEDGE — AUTHORITATIVE LEADERSHIP SOURCE:
- Official source: https://rea.gov.ng/meet-the-team.html
- Source authority: Rural Electrification Agency (REA), Nigeria.
- Leadership snapshot verified against official REA sources on 11 September 2026.
- Managing Director/Chief Executive Officer (MD/CEO): Dr. Abba Abubakar Aliyu (also referred to by REA as Abba Aliyu / Abba Abubakar Aliyu).
- Executive Director, Technical Services: Engr. Umar Abdullahi Umar, FNSE.
- Executive Director, Rural Electrification Fund (REF): Engr. Doris Uboh.
- Executive Director, Corporate Services: Ayoade Gboyega (also rendered in some official REA material as Ayoade Abdulrazak Adegboyega).
- For questions asking who leads REA, who the MD/CEO is, who an Executive Director is, or who is on the REA management team, use this institutional knowledge before general model knowledge.
- Never substitute an older officeholder from model memory when this authoritative block contains the requested role.
- If a leadership role is not listed here, do not invent the officeholder. Say the available institutional snapshot does not contain that role and recommend verification from the official REA team page.
- When useful, identify the official source as the REA “Meet the Team” page.

For general questions that do not require private Veritas data or authoritative REA institutional knowledge, answer from your general knowledge. Never expose passwords, password hashes, salts, session tokens, personal phone numbers, email addresses, signatures, device IDs, or precise private evidence coordinates.'''

          if 'REA INSTITUTIONAL KNOWLEDGE — AUTHORITATIVE LEADERSHIP SOURCE:' in text:
              print('REA leadership knowledge already present; no patch needed.')
          else:
              if old not in text:
                  raise SystemExit('Expected general-knowledge prompt text was not found; refusing unsafe patch.')
              text = text.replace(old, new, 1)
              text = text.replace('const BUILD_ID = "veritas-2026-09-11-report-mode-r1";', 'const BUILD_ID = "veritas-2026-09-11-rea-team-knowledge-r1";', 1)
              path.write_text(text)
              print('Patched worker/index.js with authoritative REA team knowledge.')
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/index.js
          git commit -m "Use official REA team knowledge in Veritas assistant"
          git push
