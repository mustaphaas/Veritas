name: Build Veritas Field Officer APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android-field-officer/**'
      - '.github/workflows/build-field-officer-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-field-officer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.11.1

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Prepare downloadable files
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk veritas-field-officer.apk
          zip -r veritas-field-officer-android-studio.zip . \
            -x '.gradle/*' 'app/build/*' 'build/*' 'veritas-field-officer-android-studio.zip' 'veritas-field-officer.apk'

      - name: Upload APK and Android Studio project
        uses: actions/upload-artifact@v4
        with:
          name: veritas-field-officer-android
          path: |
            android-field-officer/veritas-field-officer.apk
            android-field-officer/veritas-field-officer-android-studio.zip
          retention-days: 30
