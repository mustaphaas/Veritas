name: Apply REA Access Control Fix

on:
  push:
    branches: [main]
    paths:
      - scripts/fix_rea_access_control_once.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply access-control fix
        run: python scripts/fix_rea_access_control_once.py
      - name: Commit access-control fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/lib/rea-admin.ts client/lib/auth.tsx client/pages/Index.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Enforce REA user access control"
          git push origin main
