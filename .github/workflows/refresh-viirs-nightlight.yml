name: Refresh VIIRS night-light impact

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Optional number of projects to process (0 = all)"
        required: false
        default: "0"
      force_all:
        description: "Reprocess all eligible projects instead of only missing/stale results"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - '.github/workflows/refresh-viirs-nightlight.yml'
  schedule:
    # Daily incremental refresh at 03:17 UTC (04:17 WAT).
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: viirs-nightlight-impact
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate VIIRS ingestion script
        run: python -m py_compile scripts/ingest-viirs-nightlights.py

      - name: Require NASA Earthdata credential
        env:
          NASA_EARTHDATA_TOKEN: ${{ secrets.NASA_EARTHDATA_TOKEN }}
        run: |
          if [ -z "$NASA_EARTHDATA_TOKEN" ]; then
            echo "::error::NASA_EARTHDATA_TOKEN is not configured. VIIRS ingestion cannot run."
            exit 1
          fi

      - name: Install processing dependencies
        run: python -m pip install --disable-pip-version-check numpy h5py

      - name: Export projects needing VIIRS analysis
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FORCE_ALL: ${{ github.event.inputs.force_all || 'false' }}
        run: |
          if [ "$FORCE_ALL" = "true" ]; then
            SQL="SELECT p.id,p.latitude,p.longitude,p.commissioned_at AS commissionedAt,'field completion date' AS dateBasis FROM projects p WHERE p.commissioned_at IS NOT NULL AND p.latitude IS NOT NULL AND p.longitude IS NOT NULL ORDER BY p.id"
          else
            SQL="SELECT p.id,p.latitude,p.longitude,p.commissioned_at AS commissionedAt,'field completion date' AS dateBasis FROM projects p LEFT JOIN project_nightlight_impacts n ON n.project_id=p.id WHERE p.commissioned_at IS NOT NULL AND p.latitude IS NOT NULL AND p.longitude IS NOT NULL AND (n.project_id IS NULL OR (n.data_quality IN ('limited','moderate') AND datetime(n.checked_at) <= datetime('now','-30 days'))) ORDER BY p.id"
          fi

          npx wrangler@latest d1 execute veritas-production --remote --config wrangler.jsonc --json \
            --command "$SQL" > /tmp/viirs-projects.json

      - name: Download NASA Black Marble and calculate before/after impact
        env:
          NASA_EARTHDATA_TOKEN: ${{ secrets.NASA_EARTHDATA_TOKEN }}
        run: |
          python scripts/ingest-viirs-nightlights.py \
            --projects-json /tmp/viirs-projects.json \
            --output-sql /tmp/viirs-impact.sql \
            --cache-dir /tmp/viirs-cache \
            --limit "${{ github.event.inputs.limit || '0' }}"

      - name: Write VIIRS impact results to production D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest d1 execute veritas-production --remote --config wrangler.jsonc \
            --file /tmp/viirs-impact.sql
