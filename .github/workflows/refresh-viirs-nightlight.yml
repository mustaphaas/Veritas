name: Refresh VIIRS night-light impact

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of projects to process in this run (0 = all)"
        required: false
        default: "5"
      project_id:
        description: "Optional exact project ID to process immediately"
        required: false
        default: ""
      force_all:
        description: "Reprocess all eligible projects instead of only missing/stale results"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - '.github/workflows/refresh-viirs-nightlight.yml'
      - 'scripts/ingest-viirs-nightlights.py'
  schedule:
    # Daily incremental refresh at 03:17 UTC (04:17 WAT).
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: viirs-nightlight-impact
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate VIIRS ingestion script
        run: python -m py_compile scripts/ingest-viirs-nightlights.py

      - name: Require NASA Earthdata credential
        env:
          NASA_EARTHDATA_TOKEN: ${{ secrets.NASA_EARTHDATA_TOKEN }}
        run: |
          if [ -z "$NASA_EARTHDATA_TOKEN" ]; then
            echo "::error::NASA_EARTHDATA_TOKEN is not configured. VIIRS ingestion cannot run."
            exit 1
          fi

      - name: Install processing dependencies
        run: python -m pip install --disable-pip-version-check numpy h5py

      - name: Apply VIIRS database migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest d1 migrations apply veritas-production --remote --config wrangler.jsonc

      - name: Export projects needing VIIRS analysis
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FORCE_ALL: ${{ github.event.inputs.force_all || 'false' }}
          PROJECT_ID: ${{ github.event.inputs.project_id || '' }}
          REQUESTED_LIMIT: ${{ github.event.inputs.limit || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -n "$PROJECT_ID" ]; then
            SAFE_PROJECT_ID=${PROJECT_ID//\'/\'\'}
            SQL="SELECT p.id,p.latitude,p.longitude,p.commissioned_at AS commissionedAt,'field completion date' AS dateBasis FROM projects p WHERE p.id='$SAFE_PROJECT_ID' AND p.commissioned_at IS NOT NULL AND p.latitude IS NOT NULL AND p.longitude IS NOT NULL LIMIT 1"
          else
            if [ "$EVENT_NAME" = "push" ]; then
              BATCH_LIMIT=1
            elif [ -n "$REQUESTED_LIMIT" ]; then
              BATCH_LIMIT="$REQUESTED_LIMIT"
            else
              BATCH_LIMIT=5
            fi

            LIMIT_SQL=""
            if [ "$BATCH_LIMIT" != "0" ]; then
              LIMIT_SQL=" LIMIT $BATCH_LIMIT"
            fi

            if [ "$FORCE_ALL" = "true" ]; then
              SQL="SELECT p.id,p.latitude,p.longitude,p.commissioned_at AS commissionedAt,'field completion date' AS dateBasis FROM projects p WHERE p.commissioned_at IS NOT NULL AND p.latitude IS NOT NULL AND p.longitude IS NOT NULL ORDER BY datetime(COALESCE(p.updated_at,p.created_at)) DESC,p.id$LIMIT_SQL"
            else
              SQL="SELECT p.id,p.latitude,p.longitude,p.commissioned_at AS commissionedAt,'field completion date' AS dateBasis FROM projects p LEFT JOIN project_nightlight_impacts n ON n.project_id=p.id WHERE p.commissioned_at IS NOT NULL AND p.latitude IS NOT NULL AND p.longitude IS NOT NULL AND (n.project_id IS NULL OR n.analysis_method IS NULL OR n.analysis_method <> 'near-nadir-snow-free-multi-metric-v2' OR (n.data_quality IN ('limited','moderate') AND datetime(n.checked_at) <= datetime('now','-30 days'))) ORDER BY CASE WHEN n.project_id IS NULL THEN 0 WHEN n.analysis_method IS NULL OR n.analysis_method <> 'near-nadir-snow-free-multi-metric-v2' THEN 1 ELSE 2 END,datetime(COALESCE(p.updated_at,p.created_at)) DESC,p.id$LIMIT_SQL"
            fi
          fi

          npx wrangler@latest d1 execute veritas-production --remote --config wrangler.jsonc --json \
            --command "$SQL" > /tmp/viirs-projects.json

      - name: Download NASA Black Marble and calculate before/after impact
        env:
          NASA_EARTHDATA_TOKEN: ${{ secrets.NASA_EARTHDATA_TOKEN }}
        run: |
          python scripts/ingest-viirs-nightlights.py \
            --projects-json /tmp/viirs-projects.json \
            --output-sql /tmp/viirs-impact.sql \
            --cache-dir /tmp/viirs-cache \
            --limit "0"

      - name: Write VIIRS impact results to production D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest d1 execute veritas-production --remote --config wrangler.jsonc \
            --file /tmp/viirs-impact.sql
