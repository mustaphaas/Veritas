name: Repair tenancy patch idempotence

on:
  push:
    branches:
      - fix/consultant-d1-tenancy
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/consultant-d1-tenancy
      - name: Make Trash2 import patch idempotent
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'scripts/patch-consultant-d1-tenancy.mjs';
          let source = fs.readFileSync(path, 'utf8');
          const oldLine = "dashboard = dashboard.replace('  RotateCcw,\\n  ShieldCheck,', '  RotateCcw,\\n  ShieldCheck,\\n  Trash2,');";
          const newLine = "if (!dashboard.includes('  Trash2,')) dashboard = dashboard.replace('  RotateCcw,\\n  ShieldCheck,', '  RotateCcw,\\n  ShieldCheck,\\n  Trash2,');";
          if (!source.includes(newLine)) {
            if (!source.includes(oldLine)) throw new Error('Trash2 patch anchor not found');
            source = source.replace(oldLine, newLine);
          }
          fs.writeFileSync(path, source);
          NODE
          node --check scripts/patch-consultant-d1-tenancy.mjs
          node scripts/patch-consultant-d1-tenancy.mjs
          node scripts/patch-consultant-d1-tenancy.mjs
          node --check worker/index.js
      - name: Commit repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "veritas-ci"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/patch-consultant-d1-tenancy.mjs client/pages/ConsultantAdminDashboard.tsx
          git commit -m "fix: keep consultant tenancy patch idempotent"
          git push origin HEAD:fix/consultant-d1-tenancy
