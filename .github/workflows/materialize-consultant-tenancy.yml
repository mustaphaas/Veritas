name: Materialize consultant tenancy source

on:
  push:
    branches:
      - fix/consultant-d1-tenancy
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/consultant-d1-tenancy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply tenancy patch to checked-in source
        run: |
          node scripts/patch-consultant-d1-tenancy.mjs
          node --check worker/index.js
      - name: Commit materialized source
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "veritas-ci"
          git config user.email "actions@users.noreply.github.com"
          git add worker/index.js client/lib/field-api.ts client/lib/inspection-workflow.tsx client/components/ReaConsultantsManagement.tsx client/lib/auth.tsx client/pages/ConsultantAdminDashboard.tsx
          git commit -m "feat: materialize D1 consultant tenancy"
          git push origin HEAD:fix/consultant-d1-tenancy
