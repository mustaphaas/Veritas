name: Apply Project Map Improvement

on:
  push:
    branches: [main]
    paths:
      - scripts/improve_project_map_once.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Improve project map
        run: python scripts/improve_project_map_once.py

      - name: Commit project map improvements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/components/ReaProjectMapProgramme.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Improve project map geography and visuals"
          git push origin main
