name: Apply Project Map GPS and Palette

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_project_map_gps_palette.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply focused Project Map update
        run: python scripts/apply_project_map_gps_palette.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/components/ReaProjectMapProgramme.tsx client/lib/dashboard-data.ts
          git diff --cached --quiet && exit 0
          git commit -m "Match Project Map palette and add geographic coordinates"
          git push origin main
