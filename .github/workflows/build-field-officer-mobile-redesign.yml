name: Build Redesigned Field Officer APK

on:
  workflow_dispatch:
  push:
    branches:
      - field-officer-mobile-redesign
    paths:
      - 'field-officer-mobile/**'
      - '.github/workflows/build-field-officer-mobile-redesign.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: field-officer-mobile

    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: field-officer-mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Expo doctor
        run: npx expo-doctor@latest

      - name: Typecheck
        run: npm run typecheck

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Build standalone release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/release/app-release.apk veritas-field-officer-redesign-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: veritas-field-officer-redesign-release-apk
          path: field-officer-mobile/veritas-field-officer-redesign-release.apk
          retention-days: 30
