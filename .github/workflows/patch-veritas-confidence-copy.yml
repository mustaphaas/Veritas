name: Add OpenRouter Gemini routing to Veritas

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-veritas-confidence-copy.yml'

permissions:
  contents: write

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Prefer OpenRouter Gemini with direct Gemini fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('worker/index.js')
          s = p.read_text()

          s = s.replace(
              'const BUILD_ID = "veritas-2026-09-11-component-crosstab-r1";',
              'const BUILD_ID = "veritas-2026-09-11-openrouter-gemini-r1";'
          )

          gemini_extractor = '''function extractGeminiText(payload) {\n  const parts = [];\n  for (const candidate of payload?.candidates || []) {\n    for (const part of candidate?.content?.parts || []) {\n      if (typeof part?.text === "string" && part.text.trim()) parts.push(part.text.trim());\n    }\n  }\n  return parts.join("\\n\\n").trim();\n}\n'''

          openrouter_extractor = gemini_extractor + '''\nfunction extractOpenRouterText(payload) {\n  const content = payload?.choices?.[0]?.message?.content;\n  if (typeof content === "string") return content.trim();\n  if (Array.isArray(content)) {\n    return content\n      .map((part) => (typeof part?.text === "string" ? part.text.trim() : ""))\n      .filter(Boolean)\n      .join("\\n\\n")\n      .trim();\n  }\n  return "";\n}\n'''

          if 'function extractOpenRouterText(payload)' not in s:
              if gemini_extractor not in s:
                  raise SystemExit('Gemini extractor marker not found')
              s = s.replace(gemini_extractor, openrouter_extractor, 1)

          old_block = '''  if (!env.GEMINI_API_KEY) {\n    console.error(JSON.stringify({ event: "veritas_provider_unconfigured", provider: "gemini", build: BUILD_ID }));\n    return json({ error: "Veritas AI service is currently unavailable.", build: BUILD_ID }, 503);\n  }\n\n  const databaseContext = await liveDatabaseContext(env);\n  const model = env.GEMINI_MODEL || "gemini-3.6-flash";\n  const upstream = await fetch(\n    `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,\n    {\n      method: "POST",\n      headers: { "Content-Type": "application/json", "x-goog-api-key": env.GEMINI_API_KEY },\n      body: JSON.stringify({\n        contents: [{ role: "user", parts: [{ text: buildInput(body.messages, databaseContext) }] }],\n        generationConfig: { maxOutputTokens: 3000, temperature: 0.45 },\n      }),\n    },\n  );\n\n  const payload = await upstream.json().catch(() => ({}));\n  if (!upstream.ok) {\n    console.error(JSON.stringify({\n      event: "veritas_provider_error",\n      provider: "gemini",\n      status: upstream.status,\n      model,\n      upstreamMessage: String(payload?.error?.message || ""),\n      build: BUILD_ID,\n    }));\n    return json({ error: publicVeritasError(upstream.status), build: BUILD_ID }, upstream.status === 429 ? 429 : 503);\n  }\n\n  const answer = extractGeminiText(payload);\n'''

          new_block = '''  if (!env.OPENROUTER_API_KEY && !env.GEMINI_API_KEY) {\n    console.error(JSON.stringify({ event: "veritas_provider_unconfigured", provider: "veritas-ai", build: BUILD_ID }));\n    return json({ error: "Veritas AI service is currently unavailable.", build: BUILD_ID }, 503);\n  }\n\n  const databaseContext = await liveDatabaseContext(env);\n  const prompt = buildInput(body.messages, databaseContext);\n  let upstream;\n  let payload;\n  let provider;\n  let model;\n\n  if (env.OPENROUTER_API_KEY) {\n    provider = "openrouter";\n    model = env.OPENROUTER_MODEL || "google/gemini-3.8-flash";\n    upstream = await fetch("https://openrouter.ai/api/v1/chat/completions", {\n      method: "POST",\n      headers: {\n        "Authorization": `Bearer ${env.OPENROUTER_API_KEY}`,\n        "Content-Type": "application/json",\n        "HTTP-Referer": "https://veritas.mustaphaaliyu236.workers.dev",\n        "X-Title": "Veritas",\n      },\n      body: JSON.stringify({\n        model,\n        messages: [{ role: "user", content: prompt }],\n        max_tokens: 3000,\n        temperature: 0.3,\n        provider: { allow_fallbacks: true, sort: "throughput" },\n      }),\n    });\n    payload = await upstream.json().catch(() => ({}));\n  } else {\n    provider = "gemini";\n    model = env.GEMINI_MODEL || "gemini-3.6-flash";\n    upstream = await fetch(\n      `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,\n      {\n        method: "POST",\n        headers: { "Content-Type": "application/json", "x-goog-api-key": env.GEMINI_API_KEY },\n        body: JSON.stringify({\n          contents: [{ role: "user", parts: [{ text: prompt }] }],\n          generationConfig: { maxOutputTokens: 3000, temperature: 0.45 },\n        }),\n      },\n    );\n    payload = await upstream.json().catch(() => ({}));\n  }\n\n  if (!upstream.ok) {\n    console.error(JSON.stringify({\n      event: "veritas_provider_error",\n      provider,\n      status: upstream.status,\n      model,\n      upstreamMessage: String(payload?.error?.message || payload?.error || ""),\n      build: BUILD_ID,\n    }));\n    return json({ error: publicVeritasError(upstream.status), build: BUILD_ID }, upstream.status === 429 ? 429 : 503);\n  }\n\n  const answer = provider === "openrouter" ? extractOpenRouterText(payload) : extractGeminiText(payload);\n'''

          if old_block not in s:
              raise SystemExit('Provider block marker not found')
          s = s.replace(old_block, new_block, 1)

          p.write_text(s)
          PY
      - name: Commit OpenRouter routing
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/index.js
          git commit -m 'Route Veritas through OpenRouter Gemini with fallback'
          git push origin main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build client
        run: npm run build:client
      - name: Provision D1 and optional R2 bindings
        run: node scripts/provision-cloudflare.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply database migrations
        run: npx wrangler@latest d1 migrations apply veritas-production --remote --config wrangler.generated.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker and assets
        run: npx wrangler@latest deploy --config wrangler.generated.json --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
