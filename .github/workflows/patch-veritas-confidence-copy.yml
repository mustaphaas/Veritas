name: Hide Veritas Internal Analytics Names

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-veritas-confidence-copy.yml'

permissions:
  contents: write

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Remove internal implementation names from user-facing prompts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('worker/index.js')
          s = p.read_text()
          s = s.replace(
            'Aggregate portfolio/state/programme/component/contractor/consultant summaries and componentStateProgramme cross-tabs cover the full live dataset even when the project list is sampled.',
            'Authoritative aggregate summaries and multidimensional production analytics cover the full live dataset even when the project list is sampled.'
          )
          s = s.replace(
            'For questions that combine component with state and/or programme, use componentStateProgramme rather than the sampled project list.',
            'For questions that combine multiple dimensions such as component, state, and programme, use the authoritative full-database aggregate results rather than the sampled project list.'
          )
          s = s.replace(
            'Source: live Veritas D1 componentStateProgramme aggregate. No sampled project list was used.',
            'Source: live Veritas production database. No sampled project list was used.'
          )
          s = s.replace(
            'based on the authoritative `componentStateProgramme` aggregates in the live Veritas database',
            'based on authoritative live Veritas production data'
          )
          p.write_text(s)
          PY

      - name: Validate worker
        run: node --check worker/index.js

      - name: Commit wording cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/index.js
          if git diff --cached --quiet; then
            echo 'No wording changes to commit'
          else
            git commit -m 'Hide internal analytics names from Veritas responses'
            git push origin main
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build:client

      - name: Provision D1 and optional R2 bindings
        run: node scripts/provision-cloudflare.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply database migrations
        run: npx wrangler@latest d1 migrations apply veritas-production --remote --config wrangler.generated.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker and assets
        run: npx wrangler@latest deploy --config wrangler.generated.json --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
