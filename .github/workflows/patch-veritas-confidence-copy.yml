name: Deploy Veritas OpenRouter Fallbacks

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-veritas-confidence-copy.yml'
      - 'scripts/patch-openrouter-resilience.mjs'

permissions:
  contents: write

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply OpenRouter fallback patch
        run: node scripts/patch-openrouter-resilience.mjs

      - name: Validate worker
        run: node --check worker/index.js

      - name: Commit resilience update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/index.js
          if git diff --cached --quiet; then
            echo 'No resilience changes to commit'
          else
            git commit -m 'Add OpenRouter model-level fallbacks'
            git push origin main
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build:client

      - name: Provision D1 and optional R2 bindings
        run: node scripts/provision-cloudflare.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply database migrations
        run: npx wrangler@latest d1 migrations apply veritas-production --remote --config wrangler.generated.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker and assets
        run: npx wrangler@latest deploy --config wrangler.generated.json --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
