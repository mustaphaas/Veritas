name: Make Veritas cross-tab answers deterministic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-veritas-confidence-copy.yml'

permissions:
  contents: write

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Add deterministic component state programme answer
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('worker/index.js')
          s = p.read_text()
          s = s.replace(
              'const BUILD_ID = "veritas-2026-09-11-openrouter-resilience-r1";',
              'const BUILD_ID = "veritas-2026-09-11-deterministic-crosstab-r1";'
          )

          marker = 'async function veritasResponse(request, env) {\n'
          helper = r'''function exactComponentStateProgrammeAnswer(question, databaseContext) {
  const normalized = String(question || "").toLowerCase();
  const asksStateProgramme =
    normalized.includes("state") &&
    (normalized.includes("programme") || normalized.includes("program"));
  if (!asksStateProgramme) return "";

  const components = Array.isArray(databaseContext?.componentPerformance)
    ? databaseContext.componentPerformance.map((row) => String(row.component || "")).filter(Boolean)
    : [];
  const component = components.find((name) => normalized.includes(name.toLowerCase()));
  if (!component) return "";

  const crossTab = (databaseContext?.componentStateProgramme || []).filter(
    (row) => String(row.component || "") === component,
  );
  if (!crossTab.length) return "";

  const states = [...new Set(
    (databaseContext?.statePerformance || []).map((row) => String(row.state || "")).filter(Boolean),
  )].sort((a, b) => a.localeCompare(b));
  const programmeNames = [...new Set(crossTab.map((row) => String(row.programme || "Unknown")))];
  const preferred = ["NEP", "DARES", "AMP"];
  const programmes = [
    ...preferred.filter((name) => programmeNames.includes(name)),
    ...programmeNames.filter((name) => !preferred.includes(name)).sort((a, b) => a.localeCompare(b)),
  ];

  const counts = new Map();
  for (const row of crossTab) {
    counts.set(`${row.state}||${row.programme}`, Number(row.projects || 0));
  }

  const programmeTotals = Object.fromEntries(programmes.map((programme) => [programme, 0]));
  let grandTotal = 0;
  const lines = states.map((state) => {
    const values = programmes.map((programme) => {
      const value = counts.get(`${state}||${programme}`) || 0;
      programmeTotals[programme] += value;
      grandTotal += value;
      return `${programme} ${value}`;
    });
    const stateTotal = values.reduce((sum, entry) => sum + Number(entry.split(" ").at(-1) || 0), 0);
    return `${state}: ${values.join(" | ")} | Total ${stateTotal}`;
  });

  const totalsLine = programmes.map((programme) => `${programme} ${programmeTotals[programme]}`).join(" | ");
  return `Full production database breakdown for ${component} by state and programme (${grandTotal} projects):\n\n${lines.join("\n")}\n\nProgramme totals: ${totalsLine} | Total ${grandTotal}\n\nSource: live Veritas D1 componentStateProgramme aggregate. No sampled project list was used.`;
}

'''
          if 'function exactComponentStateProgrammeAnswer(' not in s:
              if marker not in s:
                  raise SystemExit('veritasResponse marker not found')
              s = s.replace(marker, helper + marker, 1)

          old = '''  const databaseContext = await liveDatabaseContext(env);\n  const prompt = buildInput(body.messages, databaseContext);\n'''
          new = '''  const databaseContext = await liveDatabaseContext(env);\n  const exactCrossTabAnswer = exactComponentStateProgrammeAnswer(question, databaseContext);\n  if (exactCrossTabAnswer) {\n    return json({ answer: exactCrossTabAnswer, sources: [], mode: "veritas-live-d1-exact", build: BUILD_ID });\n  }\n  const prompt = buildInput(body.messages, databaseContext);\n'''
          if old not in s:
              raise SystemExit('databaseContext prompt marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit deterministic cross-tab response
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/index.js
          git commit -m 'Return exact D1 cross-tab answers without AI timeout'
          git push origin main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build client
        run: npm run build:client
      - name: Provision D1 and optional R2 bindings
        run: node scripts/provision-cloudflare.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply database migrations
        run: npx wrangler@latest d1 migrations apply veritas-production --remote --config wrangler.generated.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker and assets
        run: npx wrangler@latest deploy --config wrangler.generated.json --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
