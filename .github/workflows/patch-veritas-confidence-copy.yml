name: Patch exact Veritas component totals

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-veritas-confidence-copy.yml'

permissions:
  contents: write

jobs:
  patch-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Add exact component aggregates
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('worker/index.js')
          s = p.read_text()
          s = s.replace('const BUILD_ID = "veritas-2026-09-11-output-3000-r1";', 'const BUILD_ID = "veritas-2026-09-11-exact-component-totals-r1";')
          a = '    programmePerformance: aggregateBy(projects, "programme", (label, group) => projectSummary(label, group, "programme")),\n    statePerformance:'
          b = '    programmePerformance: aggregateBy(projects, "programme", (label, group) => projectSummary(label, group, "programme")),\n    componentPerformance: aggregateBy(projects, "component", (label, group) => projectSummary(label, group, "component")),\n    statePerformance:'
          if a not in s:
              raise SystemExit('aggregate insertion point not found')
          s = s.replace(a, b, 1)
          old = 'Aggregate portfolio/state/programme/contractor/consultant summaries cover the full live dataset even when the project list is sampled.'
          new = 'Aggregate portfolio/state/programme/component/contractor/consultant summaries cover the full live dataset even when the project list is sampled. For counts, totals, percentages, rankings, and comparisons, use the exact full-database aggregates whenever available. Never estimate or extrapolate a portfolio-wide figure from the sampled project list. If an exact aggregate is unavailable, say so rather than estimating from the sample.'
          if old not in s:
              raise SystemExit('prompt insertion point not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit worker fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/index.js
          git commit -m 'Use exact D1 component totals in Veritas'
          git push origin main
