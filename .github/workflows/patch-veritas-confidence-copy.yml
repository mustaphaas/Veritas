name: Harden Veritas OpenRouter failover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-veritas-confidence-copy.yml'

permissions:
  contents: write

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Add OpenRouter timeout and direct Gemini failover
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('worker/index.js')
          s = p.read_text()
          s = s.replace(
              'const BUILD_ID = "veritas-2026-09-11-openrouter-gemini-r1";',
              'const BUILD_ID = "veritas-2026-09-11-openrouter-resilience-r1";'
          )

          start = s.index('  let upstream;\n  let payload;\n  let provider;\n  let model;\n')
          end_marker = '  const answer = provider === "openrouter" ? extractOpenRouterText(payload) : extractGeminiText(payload);\n'
          end = s.index(end_marker, start) + len(end_marker)

          replacement = '''  let upstream;\n  let payload = {};\n  let provider = "gemini";\n  let model = env.GEMINI_MODEL || "gemini-3.6-flash";\n  let answer = "";\n\n  if (env.OPENROUTER_API_KEY) {\n    provider = "openrouter";\n    model = env.OPENROUTER_MODEL || "google/gemini-3.8-flash";\n    try {\n      upstream = await fetch("https://openrouter.ai/api/v1/chat/completions", {\n        method: "POST",\n        headers: {\n          "Authorization": `Bearer ${env.OPENROUTER_API_KEY}`,\n          "Content-Type": "application/json",\n          "HTTP-Referer": "https://veritas.mustaphaaliyu236.workers.dev",\n          "X-Title": "Veritas",\n        },\n        body: JSON.stringify({\n          model,\n          messages: [{ role: "user", content: prompt }],\n          max_tokens: 3000,\n          temperature: 0.3,\n          provider: { allow_fallbacks: true, sort: "throughput" },\n        }),\n        signal: AbortSignal.timeout(25000),\n      });\n      payload = await upstream.json().catch(() => ({}));\n      if (upstream.ok) answer = extractOpenRouterText(payload);\n    } catch (error) {\n      console.error(JSON.stringify({\n        event: "veritas_openrouter_timeout_or_network_error",\n        message: error instanceof Error ? error.message : "Unknown error",\n        build: BUILD_ID,\n      }));\n    }\n\n    if (!upstream?.ok || !answer) {\n      console.error(JSON.stringify({\n        event: "veritas_openrouter_fallback",\n        status: upstream?.status || 0,\n        model,\n        upstreamMessage: String(payload?.error?.message || payload?.error || ""),\n        build: BUILD_ID,\n      }));\n    }\n  }\n\n  if (!answer && env.GEMINI_API_KEY) {\n    provider = "gemini";\n    model = env.GEMINI_MODEL || "gemini-3.6-flash";\n    try {\n      upstream = await fetch(\n        `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,\n        {\n          method: "POST",\n          headers: { "Content-Type": "application/json", "x-goog-api-key": env.GEMINI_API_KEY },\n          body: JSON.stringify({\n            contents: [{ role: "user", parts: [{ text: prompt }] }],\n            generationConfig: { maxOutputTokens: 3000, temperature: 0.45 },\n          }),\n          signal: AbortSignal.timeout(30000),\n        },\n      );\n      payload = await upstream.json().catch(() => ({}));\n      if (upstream.ok) answer = extractGeminiText(payload);\n    } catch (error) {\n      console.error(JSON.stringify({\n        event: "veritas_direct_gemini_timeout_or_network_error",\n        message: error instanceof Error ? error.message : "Unknown error",\n        build: BUILD_ID,\n      }));\n    }\n  }\n\n  if (!answer) {\n    console.error(JSON.stringify({\n      event: "veritas_all_ai_routes_failed",\n      provider,\n      status: upstream?.status || 0,\n      model,\n      upstreamMessage: String(payload?.error?.message || payload?.error || ""),\n      build: BUILD_ID,\n    }));\n    return json({ error: publicVeritasError(upstream?.status || 503), build: BUILD_ID }, upstream?.status === 429 ? 429 : 503);\n  }\n'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)

          c = Path('client/components/VeritasAssistant.tsx')
          cs = c.read_text()
          old = '      const response = await fetch("/api/veritas", {\n        method: "POST",'
          new = '      const response = await fetch("/api/veritas", {\n        method: "POST",\n        signal: AbortSignal.timeout(60000),'
          if old not in cs:
              raise SystemExit('Client fetch marker not found')
          cs = cs.replace(old, new, 1)
          c.write_text(cs)
          PY
      - name: Commit resilience fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/index.js client/components/VeritasAssistant.tsx
          git commit -m 'Add resilient OpenRouter fallback and request timeouts'
          git push origin main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build client
        run: npm run build:client
      - name: Provision D1 and optional R2 bindings
        run: node scripts/provision-cloudflare.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply database migrations
        run: npx wrangler@latest d1 migrations apply veritas-production --remote --config wrangler.generated.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker and assets
        run: npx wrangler@latest deploy --config wrangler.generated.json --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
