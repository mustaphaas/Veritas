name: Verify consultant tenancy

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare generated consultant sources
        run: |
          node --check scripts/patch-consultant-login-compatibility.mjs
          node scripts/patch-consultant-login-compatibility.mjs
          node scripts/patch-consultant-d1-tenancy.mjs
          node scripts/patch-consultant-project-identity.mjs
          node scripts/patch-consultant-assignment-normalized-identity.mjs
          node scripts/patch-consultant-coverage-map-full-portfolio.mjs
      - name: Run Node regression tests
        # Legacy contract tests can mutate generated patch targets. Prepare the
        # deployment-equivalent consultant source first, then serialize the suite
        # so later patch checks cannot race each other.
        run: node --test --test-concurrency=1 tests/*.test.mjs
      - name: Run client Vitest suite
        run: npx vitest --run client
      - name: Validate worker syntax
        run: node --check worker/index.js
      - name: Typecheck
        run: npm run typecheck
      - name: Build application
        run: npm run build
