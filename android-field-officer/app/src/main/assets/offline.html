<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Veritas Field Officer</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f8f5;color:#173b2a;display:grid;min-height:100vh;place-items:center;padding:24px}.card{max-width:420px;background:#fff;border:1px solid #dce8e0;border-radius:18px;padding:28px;text-align:center;box-shadow:0 18px 50px rgba(8,115,63,.08)}.mark{width:58px;height:58px;border-radius:16px;background:#08733f;color:#fff;display:grid;place-items:center;margin:0 auto 18px;font-weight:800;font-size:24px}h1{font-size:22px;margin:0 0 10px}p{font-size:14px;line-height:1.6;color:#5b6f63;margin:0 0 22px}button{border:0;border-radius:10px;background:#08733f;color:#fff;font-weight:700;padding:12px 20px;font-size:14px}</style>
</head>
<body>
  <main class="card">
    <div class="mark">V</div>
    <h1>Connection unavailable</h1>
    <p>Your saved field data remains on this device. Reconnect to the internet to load or sync the Veritas Field Officer workspace.</p>
    <button onclick="location.href='https://veritas.mustaphaaliyu236.workers.dev/field-officer'">Retry connection</button>
  </main>
</body>
</html>
